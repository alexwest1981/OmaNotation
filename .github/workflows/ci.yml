name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"        # the version on the machine this is developed on

      - name: a runner has no PipeWire - hand the device tests a fake pactl
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          ln -s "$PWD/tools/fake-pactl" "$RUNNER_TEMP/bin/pactl"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Syntax
        run: python3 -m py_compile notat test_notat.py tools/*.py tools/fake-pactl

      - name: Tests
        run: |
          command -v rg >/dev/null && echo "ripgrep: $(rg --version | head -1)" \
            || echo "no ripgrep - the vault search test skips itself"
          python3 test_notat.py

      # NOT covered here: the bar widget (needs quickshell + Qt) and the marketplace's own
      # structure/security bots. The widget is checked on the machine with
      # `omarchy plugin validate <folder>` and the popup regression script.
